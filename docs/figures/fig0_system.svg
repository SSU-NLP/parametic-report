<svg viewBox="0 0 1400 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1400" height="450" fill="#ffffff"/>

  <defs>
    <marker id="aEnd" markerWidth="11" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3a3a3a"/>
    </marker>
    <marker id="aStart" markerWidth="11" markerHeight="9" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <!-- ═══════ Desktop App ═══════ -->
  <text x="40" y="82" font-size="26" font-weight="bold" fill="#1a1a1a">Desktop App</text>
  <rect x="40" y="95" width="330" height="290" rx="10" fill="#fbfbfa" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="68" y="120" width="274" height="78" rx="7" fill="#f2f2f0" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="205" y="152" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Explorer</text>
  <text x="205" y="178" font-size="14" fill="#555555" text-anchor="middle">models · data · regions</text>

  <rect x="68" y="210" width="274" height="78" rx="7" fill="#e7f1fb" stroke="#2f6fb0" stroke-width="1.3"/>
  <text x="205" y="242" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Views</text>
  <text x="205" y="268" font-size="14" fill="#555555" text-anchor="middle">output · attention · spot · log</text>

  <rect x="68" y="300" width="274" height="78" rx="7" fill="#fdf1e2" stroke="#c07d2e" stroke-width="1.3"/>
  <text x="205" y="332" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Chat + Knobs</text>
  <text x="205" y="358" font-size="14" fill="#555555" text-anchor="middle">prompt · α-knob · A/B</text>

  <!-- ═══════ WebSocket (transport) ═══════ -->
  <text x="475" y="205" font-size="23" font-weight="bold" fill="#1a1a1a" text-anchor="middle">WebSocket</text>
  <polygon points="392,245 424,221 424,235 526,235 526,221 558,245 526,269 526,255 424,255 424,269" fill="#d4d4d2" stroke="#9a9a9a" stroke-width="1"/>
  <text x="475" y="300" font-size="16" fill="#1a1a1a" text-anchor="middle">→ commands</text>
  <text x="475" y="324" font-size="16" fill="#2f6fb0" text-anchor="middle">← live signals</text>

  <!-- ═══════ Kernel ═══════ -->
  <text x="580" y="82" font-size="26" font-weight="bold" fill="#1a1a1a">Kernel</text>
  <rect x="580" y="95" width="430" height="290" rx="10" fill="#fbfbfa" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Model Session -->
  <rect x="600" y="120" width="232" height="245" rx="8" fill="#f2f2f0" stroke="#3a3a3a" stroke-width="1.3"/>
  <text x="716" y="150" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Model Session</text>
  <rect x="612" y="168" width="100" height="46" rx="6" fill="#e7f1fb" stroke="#2f6fb0" stroke-width="1.2"/>
  <text x="662" y="197" font-size="15" fill="#1a1a1a" text-anchor="middle">Observe</text>
  <rect x="720" y="168" width="100" height="46" rx="6" fill="#fdf1e2" stroke="#c07d2e" stroke-width="1.2"/>
  <text x="770" y="197" font-size="15" fill="#1a1a1a" text-anchor="middle">Locate</text>
  <rect x="612" y="222" width="100" height="46" rx="6" fill="#fdf1e2" stroke="#c07d2e" stroke-width="1.2"/>
  <text x="662" y="251" font-size="15" fill="#1a1a1a" text-anchor="middle">Intervene</text>
  <rect x="720" y="222" width="100" height="46" rx="6" fill="#fbf4d3" stroke="#c9a72b" stroke-width="1.2"/>
  <text x="770" y="251" font-size="15" fill="#1a1a1a" text-anchor="middle">Evaluate</text>
  <text x="716" y="298" font-size="14" font-style="italic" fill="#555555" text-anchor="middle">resident model · reversible edits</text>
  <text x="716" y="322" font-size="14" font-style="italic" fill="#555555" text-anchor="middle">bf16 · MPS / CUDA</text>

  <!-- Storage -->
  <rect x="848" y="120" width="144" height="108" rx="8" fill="#ececea" stroke="#3a3a3a" stroke-width="1.3"/>
  <text x="920" y="150" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Storage</text>
  <text x="920" y="176" font-size="14" fill="#555555" text-anchor="middle">regions</text>
  <text x="920" y="196" font-size="14" fill="#555555" text-anchor="middle">runs</text>
  <text x="920" y="216" font-size="14" fill="#555555" text-anchor="middle">datasets</text>

  <!-- Dispatcher -->
  <rect x="848" y="243" width="144" height="122" rx="8" fill="#ececea" stroke="#3a3a3a" stroke-width="1.3"/>
  <text x="920" y="273" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Dispatcher</text>
  <text x="920" y="300" font-size="14" fill="#555555" text-anchor="middle">session / model</text>
  <text x="920" y="321" font-size="14" fill="#555555" text-anchor="middle">routing</text>
  <text x="920" y="342" font-size="14" fill="#555555" text-anchor="middle">off-loop ↻</text>

  <!-- Desktop ⇄ Kernel big arrow -->
  <!-- (the chunky polygon above spans the gap) -->
  <line x1="370" y1="245" x2="392" y2="245" stroke="#9a9a9a" stroke-width="1"/>
  <line x1="558" y1="245" x2="580" y2="245" stroke="#9a9a9a" stroke-width="1"/>

  <!-- ═══════ Resources ═══════ -->
  <text x="1090" y="82" font-size="26" font-weight="bold" fill="#1a1a1a">Resources</text>

  <rect x="1090" y="120" width="220" height="80" rx="10" fill="#ececea" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="1200" y="153" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Hugging Face</text>
  <text x="1200" y="178" font-size="15" fill="#555555" text-anchor="middle">pretrained weights</text>

  <rect x="1090" y="215" width="220" height="80" rx="10" fill="#e7f1fb" stroke="#2f6fb0" stroke-width="1.5"/>
  <text x="1200" y="248" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Cloud GPU</text>
  <text x="1200" y="273" font-size="15" fill="#555555" text-anchor="middle">remote compute</text>

  <rect x="1090" y="310" width="220" height="80" rx="10" fill="#fdf1e2" stroke="#c07d2e" stroke-width="1.5"/>
  <text x="1200" y="343" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MPS · CUDA</text>
  <text x="1200" y="368" font-size="15" fill="#555555" text-anchor="middle">local compute</text>

  <!-- Kernel ⇄ Resources -->
  <line x1="1010" y1="160" x2="1090" y2="160" stroke="#3a3a3a" stroke-width="1.6" stroke-dasharray="5 3" marker-start="url(#aStart)" marker-end="url(#aEnd)"/>
  <text x="1050" y="150" font-size="14" font-style="italic" fill="#555555" text-anchor="middle">weights</text>
  <line x1="1010" y1="255" x2="1090" y2="255" stroke="#3a3a3a" stroke-width="1.6" stroke-dasharray="5 3" marker-start="url(#aStart)" marker-end="url(#aEnd)"/>
  <text x="1050" y="245" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SSH</text>
  <line x1="1010" y1="350" x2="1090" y2="350" stroke="#3a3a3a" stroke-width="1.6" stroke-dasharray="5 3" marker-start="url(#aStart)" marker-end="url(#aEnd)"/>
  <text x="1050" y="340" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Local</text>
</svg>
