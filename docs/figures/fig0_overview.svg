<svg viewBox="0 0 1400 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1400" height="640" fill="#ffffff"/>

  <defs>
    <marker id="arrN" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrB" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- ─── zone separators + labels (layered-stack reference) ─── -->
  <line x1="480" y1="70" x2="480" y2="600" stroke="#dddddd" stroke-width="1"/>
  <line x1="800" y1="70" x2="800" y2="600" stroke="#dddddd" stroke-width="1"/>
  <line x1="1040" y1="70" x2="1040" y2="600" stroke="#dddddd" stroke-width="1"/>
  <g font-size="17" fill="#999999" text-anchor="middle" letter-spacing="3">
    <text x="250" y="52">INTERFACE</text>
    <text x="640" y="52">TRANSPORT</text>
    <text x="920" y="52">KERNEL</text>
    <text x="1205" y="52">RESOURCES</text>
  </g>

  <!-- ─── Desktop app ─── -->
  <text x="50" y="93" font-size="28" font-weight="bold" fill="#1a1a1a">Desktop app</text>
  <rect x="50" y="108" width="390" height="412" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="7 5"/>

  <!-- observe chip -->
  <rect x="90" y="148" width="310" height="150" rx="10" fill="#e8eefb" stroke="#1d4ed8" stroke-width="1.5"/>
  <g stroke="#1d4ed8" stroke-width="1">
    <rect x="170" y="173" width="30" height="20" fill="#ffffff"/>
    <rect x="200" y="173" width="30" height="20" fill="#93b4f0"/>
    <rect x="230" y="173" width="30" height="20" fill="#c7d7f7"/>
    <rect x="260" y="173" width="30" height="20" fill="#1d4ed8"/>
    <rect x="290" y="173" width="30" height="20" fill="#93b4f0"/>
    <rect x="170" y="193" width="30" height="20" fill="#c7d7f7"/>
    <rect x="200" y="193" width="30" height="20" fill="#1d4ed8"/>
    <rect x="230" y="193" width="30" height="20" fill="#93b4f0"/>
    <rect x="260" y="193" width="30" height="20" fill="#ffffff"/>
    <rect x="290" y="193" width="30" height="20" fill="#c7d7f7"/>
    <rect x="170" y="213" width="30" height="20" fill="#93b4f0"/>
    <rect x="200" y="213" width="30" height="20" fill="#c7d7f7"/>
    <rect x="230" y="213" width="30" height="20" fill="#ffffff"/>
    <rect x="260" y="213" width="30" height="20" fill="#93b4f0"/>
    <rect x="290" y="213" width="30" height="20" fill="#c7d7f7"/>
  </g>
  <text x="245" y="272" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">observe</text>

  <!-- intervene chip -->
  <rect x="90" y="328" width="310" height="150" rx="10" fill="#fdf1e2" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="225" cy="392" r="26" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <line x1="225" y1="392" x2="242" y2="375" stroke="#b45309" stroke-width="2.5"/>
  <text x="272" y="401" font-size="26" font-style="italic" fill="#1a1a1a">α</text>
  <text x="245" y="452" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">intervene</text>

  <text x="245" y="502" font-size="19" font-style="italic" fill="#555555" text-anchor="middle">researcher in the loop</text>

  <!-- ─── Transport ─── -->
  <text x="640" y="245" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="middle">WebSocket</text>

  <line x1="440" y1="300" x2="820" y2="300" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arrN)"/>
  <rect x="562" y="282" width="156" height="36" rx="18" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="640" y="307" font-size="22" fill="#1a1a1a" text-anchor="middle">commands</text>

  <line x1="820" y1="400" x2="440" y2="400" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrB)"/>
  <rect x="558" y="382" width="164" height="36" rx="18" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="640" y="407" font-size="22" fill="#1d4ed8" text-anchor="middle">live signals</text>
  <text x="640" y="448" font-size="18" font-style="italic" fill="#555555" text-anchor="middle">every token</text>

  <!-- ─── Kernel ─── -->
  <rect x="820" y="108" width="200" height="412" rx="6" fill="#f7f7f5" stroke="#3a3a3a" stroke-width="1.5"/>
  <!-- layer stack with amber spot cells -->
  <g fill="#ececea" stroke="#3a3a3a" stroke-width="1.2">
    <rect x="845" y="140" width="150" height="18"/>
    <rect x="845" y="170" width="150" height="18"/>
    <rect x="845" y="200" width="150" height="18"/>
    <rect x="845" y="230" width="150" height="18"/>
    <rect x="845" y="260" width="150" height="18"/>
    <rect x="845" y="290" width="150" height="18"/>
  </g>
  <g fill="#b45309">
    <rect x="880" y="203" width="14" height="12"/>
    <rect x="932" y="203" width="14" height="12"/>
    <rect x="906" y="233" width="14" height="12"/>
    <rect x="958" y="233" width="14" height="12"/>
  </g>
  <text x="920" y="342" font-size="20" fill="#1a1a1a" text-anchor="middle">resident LLM</text>

  <rect x="832" y="366" width="176" height="62" rx="8" fill="#fdf1e2" stroke="#b45309" stroke-width="1.5"/>
  <text x="920" y="392" font-size="16" font-family="Menlo, monospace" fill="#b45309" text-anchor="middle">|grad &#215; param|</text>
  <text x="920" y="415" font-size="16" font-family="Menlo, monospace" fill="#b45309" text-anchor="middle">top-k% spot</text>

  <text x="920" y="462" font-size="18" font-style="italic" fill="#555555" text-anchor="middle">reversible edits</text>

  <!-- ─── Resources fan-out ─── -->
  <line x1="1020" y1="310" x2="1142" y2="164" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arrN)"/>
  <line x1="1020" y1="310" x2="1142" y2="312" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arrN)"/>
  <line x1="1020" y1="310" x2="1142" y2="460" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arrN)"/>
  <text x="1076" y="216" font-size="18" font-style="italic" fill="#555555">weights</text>
  <text x="1072" y="398" font-size="18" font-style="italic" fill="#555555">compute</text>

  <rect x="1150" y="120" width="200" height="86" rx="10" fill="#ececea" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="1250" y="172" font-size="24" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Model hub</text>

  <rect x="1150" y="270" width="200" height="86" rx="10" fill="#e8eefb" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="1250" y="322" font-size="24" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Cloud GPU</text>

  <rect x="1150" y="418" width="200" height="86" rx="10" fill="#fdf1e2" stroke="#b45309" stroke-width="1.5"/>
  <text x="1250" y="470" font-size="24" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MPS &#183; CUDA</text>
</svg>
