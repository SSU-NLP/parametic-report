<svg viewBox="0 0 660 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="660" height="720" fill="#ffffff"/>

  <defs>
    <marker id="arrN" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- ===================== LIFELINES ===================== -->
  <line x1="110" y1="72" x2="110" y2="706" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="330" y1="72" x2="330" y2="706" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="550" y1="72" x2="550" y2="706" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- header boxes -->
  <rect x="20" y="14" width="180" height="40" rx="4" fill="#f7f7f5" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="110" y="39" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">UI (React)</text>

  <rect x="240" y="14" width="180" height="40" rx="4" fill="#f7f7f5" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="330" y="39" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">dispatcher (<tspan font-family="Menlo, monospace" font-size="13" font-weight="bold">api.py</tspan>)</text>

  <rect x="460" y="14" width="180" height="40" rx="4" fill="#f7f7f5" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="550" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ModelSession</text>
  <text x="550" y="48" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">(worker thread)</text>

  <!-- ===================== (a) generate ===================== -->
  <line x1="20" y1="86" x2="640" y2="86" stroke="#dddddd" stroke-width="1"/>
  <text x="20" y="103" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">(a) generate</text>

  <!-- UI -> dispatcher : generate {prompt, probes} -->
  <line x1="110" y1="124" x2="326" y2="124" stroke="#3a3a3a" stroke-width="1.2" marker-end="url(#arrN)"/>
  <text x="218" y="118" font-family="Menlo, monospace" font-size="12" fill="#1a1a1a" text-anchor="middle">generate {prompt, probes}</text>

  <!-- dispatcher activation (thin) -->
  <rect x="325" y="124" width="10" height="196" fill="#f7f7f5" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="345" y="140" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#555555">off-loop: <tspan font-family="Menlo, monospace" font-style="normal">asyncio.to_thread</tspan></text>

  <!-- dispatcher -> ModelSession : generate() -->
  <line x1="335" y1="160" x2="546" y2="160" stroke="#3a3a3a" stroke-width="1.2" marker-end="url(#arrN)"/>
  <text x="443" y="154" font-family="Menlo, monospace" font-size="12" fill="#1a1a1a" text-anchor="middle">generate()</text>

  <!-- ModelSession activation spanning the loop -->
  <rect x="545" y="160" width="10" height="152" fill="#f7f7f5" stroke="#3a3a3a" stroke-width="1.2"/>

  <!-- loop frame -->
  <rect x="300" y="176" width="270" height="94" rx="4" fill="none" stroke="#1d4ed8" stroke-width="1.2"/>
  <path d="M337,176 h120 v14 h-114 l-6,-6 Z" fill="#eef2fe" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="344" y="187" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">loop  [per token]</text>

  <!-- ModelSession -> dispatcher : yield step (dashed) -->
  <line x1="545" y1="212" x2="337" y2="212" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrB)"/>
  <text x="443" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#555555" text-anchor="middle">yield step</text>

  <!-- dispatcher -> UI : token · attention (dashed blue) -->
  <line x1="325" y1="236" x2="112" y2="236" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrB)"/>
  <text x="218" y="230" font-family="Menlo, monospace" font-size="12" fill="#1d4ed8" text-anchor="middle">token · attention</text>

  <!-- interrupt: UI -> dispatcher : stop (inside loop span, alongside frame) -->
  <line x1="110" y1="258" x2="325" y2="258" stroke="#3a3a3a" stroke-width="1" marker-end="url(#arrN)"/>
  <text x="150" y="252" font-family="Menlo, monospace" font-size="12" fill="#1a1a1a">stop</text>
  <text x="150" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#555555">cooperative stop</text>

  <!-- done (dashed blue) after the loop -->
  <line x1="325" y1="302" x2="112" y2="302" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrB)"/>
  <text x="218" y="296" font-family="Menlo, monospace" font-size="12" fill="#1d4ed8" text-anchor="middle">done</text>

  <!-- ===================== (b) spot ===================== -->
  <line x1="20" y1="336" x2="640" y2="336" stroke="#dddddd" stroke-width="1"/>
  <text x="20" y="353" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">(b) spot</text>

  <!-- UI -> dispatcher : spot {examples} -->
  <line x1="110" y1="376" x2="326" y2="376" stroke="#3a3a3a" stroke-width="1.2" marker-end="url(#arrN)"/>
  <text x="218" y="370" font-family="Menlo, monospace" font-size="12" fill="#1a1a1a" text-anchor="middle">spot {examples}</text>

  <rect x="325" y="376" width="10" height="132" fill="#fdf1e2" stroke="#b45309" stroke-width="1.2"/>

  <!-- dispatcher -> ModelSession : spot_step(example) -->
  <line x1="335" y1="404" x2="546" y2="404" stroke="#3a3a3a" stroke-width="1.2" marker-end="url(#arrN)"/>
  <text x="443" y="398" font-family="Menlo, monospace" font-size="12" fill="#1a1a1a" text-anchor="middle">spot_step(example)</text>

  <rect x="545" y="404" width="10" height="60" fill="#fdf1e2" stroke="#b45309" stroke-width="1.2"/>

  <!-- loop frame [per example] -->
  <rect x="300" y="420" width="270" height="62" rx="4" fill="none" stroke="#b45309" stroke-width="1.2"/>
  <path d="M337,420 h134 v14 h-128 l-6,-6 Z" fill="#fdf1e2" stroke="#b45309" stroke-width="1.2"/>
  <text x="344" y="431" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#b45309">loop  [per example]</text>

  <!-- dispatcher -> UI : spot_progress {i, grid} (dashed amber) -->
  <line x1="325" y1="458" x2="112" y2="458" stroke="#b45309" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
  <text x="208" y="452" font-family="Menlo, monospace" font-size="12" fill="#b45309" text-anchor="middle">spot_progress {i, grid}</text>

  <!-- dispatcher -> UI : spotmap (dashed amber) -->
  <line x1="325" y1="500" x2="112" y2="500" stroke="#b45309" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
  <text x="218" y="494" font-family="Menlo, monospace" font-size="12" fill="#b45309" text-anchor="middle">spotmap</text>

  <!-- ===================== (c) intervene ===================== -->
  <line x1="20" y1="532" x2="640" y2="532" stroke="#dddddd" stroke-width="1"/>
  <text x="20" y="549" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">(c) intervene</text>

  <!-- UI -> dispatcher : intervene {region, op, alpha, key} -->
  <line x1="110" y1="576" x2="326" y2="576" stroke="#3a3a3a" stroke-width="1.2" marker-end="url(#arrN)"/>
  <text x="218" y="570" font-family="Menlo, monospace" font-size="12" fill="#1a1a1a" text-anchor="middle">intervene {region, op, &#945;, key}</text>

  <rect x="325" y="576" width="10" height="120" fill="#fdf1e2" stroke="#b45309" stroke-width="1.2"/>

  <!-- dispatcher -> ModelSession : apply(region, op, alpha) -->
  <line x1="335" y1="604" x2="546" y2="604" stroke="#3a3a3a" stroke-width="1.2" marker-end="url(#arrN)"/>
  <text x="443" y="598" font-family="Menlo, monospace" font-size="12" fill="#1a1a1a" text-anchor="middle">apply(region, op, &#945;)</text>

  <!-- ModelSession activation + amber note box with dashed leader -->
  <rect x="545" y="604" width="10" height="78" fill="#fdf1e2" stroke="#b45309" stroke-width="1.2"/>
  <rect x="340" y="624" width="200" height="46" rx="4" fill="#fdf1e2" stroke="#b45309" stroke-width="1.2"/>
  <line x1="540" y1="647" x2="545" y2="647" stroke="#b45309" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="440" y="644" font-family="Menlo, monospace" font-size="11" fill="#1a1a1a" text-anchor="middle">clear &#8594; locate_spot &#8594; apply</text>
  <text x="440" y="661" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#555555" text-anchor="middle">atomic, reversible</text>

  <!-- dispatcher -> UI : intervened {key} (dashed amber) -->
  <line x1="325" y1="694" x2="112" y2="694" stroke="#b45309" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
  <text x="218" y="688" font-family="Menlo, monospace" font-size="12" fill="#b45309" text-anchor="middle">intervened {key}</text>
</svg>
