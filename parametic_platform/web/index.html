<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parametic Report — LLM's Spot</title>
    <link rel="stylesheet" href="./styles.css" />
    <!-- Self-hosted ESM deps (vendor/, pinned versions). Previously loaded from
         esm.sh, but the demo environment can't always reach it → blank app. These
         are served from our own origin so the app never depends on a public CDN. -->
    <script type="importmap">
      {
        "imports": {
          "preact": "/app/vendor/preact.module.js",
          "preact/hooks": "/app/vendor/hooks.module.js",
          "htm": "/app/vendor/htm.module.js",
          "htm/preact": "/app/vendor/htm-preact.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This app requires JavaScript.</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
